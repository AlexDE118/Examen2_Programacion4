<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minas · Buscaminas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="root">
    <p class="cargando-inicial">Cargando…</p>
</div>

<!-- React 18 y Babel desde CDN: no se necesita Node.js, npm ni empaquetador -->
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

<!-- Cliente HTTP (fetch + async/await) -->
<script src="js/api.js"></script>

<!-- Componentes JSX (Babel los transpila en el navegador, en este orden) -->
<script type="text/babel" data-presets="react" src="js/componentes/FormularioLogin.jsx"></script>
<script type="text/babel" data-presets="react" src="js/componentes/FormularioRegistro.jsx"></script>
<script type="text/babel" data-presets="react" src="js/componentes/Tablero.jsx"></script>
<script type="text/babel" data-presets="react" src="js/componentes/PanelHistorial.jsx"></script>
<script type="text/babel" data-presets="react" src="js/componentes/TablaRanking.jsx"></script>
<script type="text/babel" data-presets="react" src="js/app.jsx"></script>
</body>
</html>
