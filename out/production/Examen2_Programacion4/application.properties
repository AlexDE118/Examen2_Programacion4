# =====================================================================
#  Buscaminas - configuracion
#  Las credenciales se leen de variables de entorno (DB_USER, DB_PASSWORD,
#  DB_HOST, DB_PORT). Los valores despues de ":" son solo para desarrollo.
# =====================================================================
spring.application.name=buscaminas
server.port=${PORT:8080}

# --- MySQL (base "minas", utf8mb4 tambien en la conexion) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/minas?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=America/Costa_Rica
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA: el esquema lo crea minas.sql, Hibernate no lo toca ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Sesion HTTP ---
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.name=MINASSESSION

# --- Nunca exponer detalles internos en los errores ---
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Costa_Rica
